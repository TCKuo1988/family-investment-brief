name: TCK LINE group daily market brief
on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a one-time connectivity test (no market data)'
        required: true
        type: boolean
        default: false
      send_today:
        description: 'Send current verified market brief now (refresh data first)'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '10 0 * * 1-5' # 08:10 Asia/Taipei Mon-Fri
permissions:
  contents: read
concurrency:
  group: tck-line-daily
  cancel-in-progress: false
jobs:
  push-line:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send one-time LINE connectivity test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python scripts/test_line_push.py
      - name: Refresh official TWSE market quotes
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.send_test) }}
        continue-on-error: true
        run: python scripts/update_twse.py
      - name: Refresh market history from Yahoo Finance
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.send_test) }}
        run: python scripts/update_history.py
      - name: Validate market sessions and send automatic LINE brief
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.send_test) }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LINE_MANUAL_TODAY: ${{ github.event_name == 'workflow_dispatch' && inputs.send_today }}
        run: python scripts/push_line_auto.py
