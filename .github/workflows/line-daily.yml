name: TCK LINE group daily market brief
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * *' # 08:10 Asia/Taipei (UTC+8)
permissions:
  contents: read
concurrency:
  group: tck-line-daily
  cancel-in-progress: false
jobs:
  push-line:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public report and push to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python scripts/push_line_brief.py
