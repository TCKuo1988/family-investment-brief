name: TCK LINE group daily market brief
on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a one-time connectivity test (no market data)'
        required: true
        type: boolean
        default: false
      preview_only:
        description: 'Preview message without sending LINE'
        required: true
        type: boolean
        default: true
      send_today:
        description: 'Send current verified market brief now (refresh data first)'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '10 0 * * 1-5' # 08:10 Asia/Taipei Mon-Fri
permissions:
  contents: read
concurrency:
  group: tck-line-daily
  cancel-in-progress: false
jobs:
  push-line:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send one-time LINE connectivity test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python scripts/test_line_push.py
      - name: Validate market sessions and send automatic LINE brief
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.send_test) }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LINE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only }}
        run: python scripts/push_line_verified.py
      - name: Upload LINE preview
        if: ${{ always() && (github.event_name == 'schedule' || !inputs.send_test) }}
        uses: actions/upload-artifact@v4
        with:
          name: line-preview
          path: line_preview.txt
          if-no-files-found: ignore
