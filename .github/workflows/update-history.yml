name: Refresh public six-month market charts
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_history.py'
  schedule:
    - cron: '30 9 * * 1-5'   # 17:30 Taiwan: Taiwan market closes
    - cron: '0 23 * * 0-4'  # 07:00 Taiwan Mon-Fri: prior US session closes
permissions:
  contents: write
jobs:
  fetch-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update only validated history
        run: python scripts/update_history.py
      - name: Save successful data updates
        run: |
          if git diff --quiet -- history.json; then
            echo "No new validated data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history.json
          git commit -m "Refresh public six-month market history"
          git push
