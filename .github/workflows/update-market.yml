name: Collect TCK market closes

on:
  workflow_dispatch:
    inputs:
      report_day:
        description: 'Taipei edition date YYYY-MM-DD (defaults to today)'
        type: string
  schedule:
    - cron: '35 23 * * 0-4' # 07:35 Taipei Mon–Fri

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-market.txt
      - name: Collect dated quotes without changing the published edition
        env:
          REPORT_DAY: ${{ inputs.report_day }}
        run: |
          args=()
          if [[ -n "$REPORT_DAY" ]]; then args+=(--report-day "$REPORT_DAY"); fi
          python scripts/collect_market.py "${args[@]}" > market-quotes.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-quotes
          path: market-quotes.json
          if-no-files-found: error
